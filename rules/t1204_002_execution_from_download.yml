title: Process Started From A User Download Directory
id: b12cefde-6646-4e7d-b8cb-ddcb5443648d
status: experimental
description: |
    Detects a process image running out of a per-user download folder, which is how
    each of the seven captured intrusions starts.
    Path matching only. An operator who copies the payload elsewhere before running
    it, or runs it from a mapped drive, does not appear here.
references:
    - https://github.com/OTRF/Security-Datasets/tree/master/datasets/compound
author: Yasin Dehfuli
date: 2026/07/08
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|contains: '\Users\'
    downloads:
        Image|contains:
            - '\Downloads\'
            - '\Downloaded Program Files\'
    condition: all of them
falsepositives:
    - Installers and updaters that users run from where they landed. Common on
      workstations, much less so on servers.
level: medium
