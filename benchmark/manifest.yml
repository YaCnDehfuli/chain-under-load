# Pinned inputs for the benchmark. Everything the harness reads is fixed to a
# commit here, so a rerun on another machine sees the same bytes.
#
# Rebuild the local copy with:  python -m eval.corpus --fetch

sources:
  security_datasets:
    url: https://github.com/OTRF/Security-Datasets.git
    commit: d9d40ef123d2c87d5d3df28c96bcab4f0faccc87
    # cone-mode sparse paths. the repo carries a lot of data we do not read.
    sparse:
      - datasets/atomic/_metadata
      - datasets/atomic/windows
      - datasets/compound/_metadata
      - datasets/compound/LSASS_campaign_01
      - datasets/compound/LSASS_campaign_02
      - datasets/compound/LSASS_campaign_03
      - datasets/compound/LSASS_campaign_04
      - datasets/compound/LSASS_campaign_05
      - datasets/compound/LSASS_campaign_06
      - datasets/compound/LSASS_campaign_07
      - datasets/compound/apt29
  sigmahq:
    url: https://github.com/SigmaHQ/sigma.git
    commit: 1aacbedf7fc04067e6b1b2594c4b7c1c2ff649a9
    sparse:
      - rules
      - rules-emerging-threats
      - rules-threat-hunting

# The controlled comparison. Same lab, same victim host, same Sysmon config,
# seven different tools reading LSASS memory. Differences in detection come
# from the tool, not from the environment.
lsass_campaigns:
  - id: LSASS_campaign_01
    tool: logonpasswords
    note: mimikatz-style in-process read
    archive: datasets/compound/LSASS_campaign_01/metasploit_logonpasswords_lsass_memory_dump.zip
    sha256: 79045fcc5a8689efed8db4911cadc11b554ef8b0bed1428ee490bb8c3f2578e6
  - id: LSASS_campaign_02
    tool: procdump
    note: signed sysinternals binary
    archive: datasets/compound/LSASS_campaign_02/metasploit_procdump_lsass_memory_dump.zip
    sha256: 2b32f11b1465f49df8bb4040652b001e4bb8a92de6ae7e84c2977abe68273f04
  - id: LSASS_campaign_03
    tool: comsvcs
    note: lolbin, rundll32 comsvcs.dll MiniDump
    archive: datasets/compound/LSASS_campaign_03/metasploit_comsvcs_lsass_memory_dump.zip
    sha256: 97a834cd72b0803d544c62cc45a41b18a4cc04a605735096be4bc5dad5e9fe7b
  - id: LSASS_campaign_04
    tool: out-minidump
    note: powershell reflective MiniDumpWriteDump
    archive: datasets/compound/LSASS_campaign_04/metasploit_out-minidump_lsass_memory_dump.zip
    sha256: d6150eab4013ed0a7fc9c6b7266187214706c543c9dc3a370603f524def5de63
  - id: LSASS_campaign_05
    tool: sharpdump
    note: .net port of out-minidump
    archive: datasets/compound/LSASS_campaign_05/metasploit_sharpdump_lsass_memory_dump.zip
    sha256: 79e347b411beefaf5c7d0c951fdcb9d308fce20f8eabe666c11fa7b6165053b8
  - id: LSASS_campaign_06
    tool: outflank-dumpert
    note: direct syscalls, bypasses userland hooks
    archive: datasets/compound/LSASS_campaign_06/metasploit_outflank-dumpert_lsass_memory_dump.zip
    sha256: ee996c0ddc32611c572f59a68869f7d4327aaac04a3aeee65916b7221347dc1d
  - id: LSASS_campaign_07
    tool: nanodump
    note: syscalls plus a hand-rolled minidump writer
    archive: datasets/compound/LSASS_campaign_07/metasploit_nanodump_lsass_memory_dump.zip
    sha256: 5335635ef2bce0fb3f8704e17fb04a3be7400ac7c4bcd6ec7c14454632acaaaf

# A different intrusion on different hosts. Used to transfer the rules onto
# telemetry they were not written for, never for per-rule scoring. Nothing here
# reconstructs the intrusion's steps.
transfer_captures:
  - id: apt29_day1
    archive: datasets/compound/apt29/day1/apt29_evals_day1_manual.zip
  - id: apt29_day2
    archive: datasets/compound/apt29/day2/apt29_evals_day2_manual.zip

# Benign corpus scope. Atomic Windows host captures are full host telemetry for
# the capture window, so events unrelated to the simulated technique are real
# background activity. A capture is eligible as benign for technique T when its
# labelled techniques exclude T and every sibling of T.
benign:
  root: datasets/atomic/windows
  # captures with no attack_mappings entry in _metadata. we cannot show these
  # are free of a given technique, so they are never counted as benign.
  require_labels: true

# Adversary effort, as data rather than as code. Each tier is a superset of the
# one before it, so the ladder is monotonic: a detection lost at one tier stays
# lost at every tier above it.
#
#   T0 baseline    the capture as recorded
#   T1 rename      the artifacts the operator brought, and the file they wrote,
#                  carry names the operator chose
#   T2 relocate    those artifacts move into a directory the mask rules exclude
#   T3 strip-pe    the PE version resource is cleared
#   T4 new-artifact-identity   the recorded fingerprints are rotated
#
# What gets renamed is every artifact the operator put on the host, not only the
# dumping tool. All seven intrusions were delivered by the same metasploit
# payload, which is a file the operator named as freely as anything else, and in
# campaign 01 it is the thing that reads LSASS. Renaming it in one capture and
# not the others would make the tiers mean something different per capture.
#
# `relocate_from` lists every spelling of the directory an artifact ran from,
# because the filtering platform records the same path in device form. An
# artifact with no `relocate_from` is not relocated, either because it is the
# file the tool wrote rather than the tool, or because it already ran from a
# directory the published access-mask rules exclude.
#
# `rebuildable` decides whether the identity tier applies to that artifact. It is
# per artifact rather than per capture: procdump is a signed Sysinternals binary
# with nothing to rebuild, and the payload that delivered it was generated by the
# operator, and both ran in campaign 02.
#
# Replacement names are checked before use by `eval.mutate.validate`: none may
# already occur in its capture, contain another token, or carry the string `dump`
# that three of nanodump's detections key on. `tests/test_mutate.py` also asserts
# that no synthetic fingerprint occurs anywhere in the pinned rule tree.
mutation:
  # Where a relocated artifact moves to. Both published access-mask rules exclude
  # every SourceImage under Program Files, and two of the seven operators put
  # their tool there already, so it is a directory these tools are observed to
  # run from rather than one chosen to produce a result.
  relocate_to: 'C:\Program Files'
  targets:
    LSASS_campaign_01:
      tool: logonpasswords
      # An in-process read from a thread injected by the payload, so the payload
      # is the tool here rather than the thing that delivered it. Nothing else
      # the operator named is on disk, and no dump file is written.
      renames:
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\stevie.marie\Downloads'
            - '\device\harddiskvolume2\users\stevie.marie\downloads'
    LSASS_campaign_02:
      tool: procdump
      renames:
        - token: procdump
          replacement: svcmon
          # Already under Program Files, which both mask rules exclude, so a
          # relocation would buy the operator nothing and modelling one anyway
          # would overstate what the tier costs the rules.
          rebuildable: false
        - token: lsass_dump
          replacement: report_a
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\NORA~1.QUE\AppData\Local\Temp\RarSFX1'
            - 'C:\Users\nora.quemona\AppData\Local\Temp\RarSFX1'
            - '\device\harddiskvolume2\users\nora.quemona\appdata\local\temp\rarsfx1'
    LSASS_campaign_03:
      tool: comsvcs
      # comsvcs.dll and rundll32.exe are system files the operator did not bring
      # and cannot rename, so they are in PROTECTED_BASENAMES. What is the
      # operator's here is the payload that launched the lolbin and the dump it
      # wrote.
      renames:
        - token: lsass-comsvcs
          replacement: report_b
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\pupy.godoy\Downloads'
            - '\device\harddiskvolume2\users\pupy.godoy\downloads'
    LSASS_campaign_04:
      tool: out-minidump
      # Fetched over http and passed to iex, so the script is never written to
      # disk. Its name and the function it defines are one token.
      renames:
        - token: Out-Minidump
          replacement: Save-Report
        - token: lsass_628
          replacement: report_c
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\pedro.gustavo\Downloads'
            - '\device\harddiskvolume2\users\pedro.gustavo\downloads'
    LSASS_campaign_05:
      tool: sharpdump
      renames:
        - token: SharpDump
          replacement: netcfgx
          rebuildable: true
        - token: debug648
          replacement: report_d
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\stevie.marie\Downloads'
            - '\device\harddiskvolume2\users\stevie.marie\downloads'
    LSASS_campaign_06:
      tool: outflank-dumpert
      renames:
        # The longer token has to win over the shorter one, or the executable
        # keeps the first half of its name. The two are separate replacements so
        # that relocating the binary does not also move the dump it wrote.
        - token: Outflank-Dumpert
          replacement: printsvc
          rebuildable: true
          # The one tool of the seven that ran from a directory no mask rule
          # excludes, so it is the one tool this relocation moves.
          relocate_from:
            - 'C:\Windows\Temp'
        - token: dumpert
          replacement: report_e
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\stevie.marie\Downloads'
            - '\device\harddiskvolume2\users\stevie.marie\downloads'
    LSASS_campaign_07:
      tool: nanodump
      renames:
        - token: nanodump
          replacement: appmgr
          rebuildable: true
        - token: lsass_dump
          replacement: report_a
        - token: winx64_payload
          replacement: wupdsvc
          rebuildable: true
          relocate_from:
            - 'C:\Users\stevie.marie\Downloads'
            - '\device\harddiskvolume2\users\stevie.marie\downloads'
