name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # the pinned SigmaHQ commit does not move, but the toolchain resolves
    # fresh, so this catches a pySigma change breaking the evaluator
    - cron: "0 6 * * 1"

jobs:
  tests:
    # unit tests do not touch the corpus, so they run on every push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - run: python -m pytest tests -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - name: seed the taxonomy cache sigma check reads
        # D3FEND is fetched from a third-party host that has returned 403 here.
        # pySigma raises rather than degrading, so an outage would fail the job
        # for a reason unrelated to any rule. See the script for why this cannot
        # change a verdict.
        run: python -m scripts.seed_validator_data
      - name: validate rule syntax
        run: sigma check rules/
      - name: rules must convert to every backend
        run: python -m scripts.convert_rules --check

  benchmark:
    # fetches roughly 1.5 GB, so the corpus is cached. Two of the three checks
    # here are derivations of a committed measurement rather than measurements,
    # which is what keeps them inside a commit loop:
    #
    #   --check              the Phase 1 benchmark, measured
    #   --check-sensitivity  the tier ladder, derived from selection.json
    #   --check-robustness   the per-rule record, derived from selection.json
    #
    # --check-selection is the measurement all three of the derived files come
    # from, and it is in the release job below because it does not fit a commit
    # loop. The derived checks still recompile the rule population, so a
    # selection file that no longer matches the rules fails here rather than
    # surviving until the release run.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - name: what is being run
        # a drift failure is only diagnosable if the log says which commit and
        # which toolchain produced it
        run: |
          echo "commit:   $(git rev-parse HEAD)"
          echo "subject:  $(git log -1 --format=%s)"
          pip list 2>/dev/null | grep -iE "^(pysigma|sigma-cli|pyyaml)" || true
      - name: cache corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ hashFiles('benchmark/manifest.yml') }}
      - name: fetch and verify
        run: python -m eval.corpus --fetch
      - name: phase 1 results must match a fresh run
        run: python -m eval.report --check
      - name: the tier ladder must match the committed selection run
        run: python -m eval.report --check-sensitivity
      - name: the robustness record must match the committed selection run
        run: python -m eval.report --check-robustness

  # Hours, and the full rule population over every tier. Scheduled only, so it
  # never blocks a commit.
  release-checks:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - name: cache corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ hashFiles('benchmark/manifest.yml') }}
      - run: python -m eval.corpus --fetch
      - name: the wide run must match a fresh run
        run: python -m eval.report --check-selection
      - name: the prescreen excludes no rule that would fire
        # exhaustive, one whole capture with and without the screen. if this
        # fails, no wide-population number can be published until it passes.
        env:
          RELEASE_CHECKS: "1"
        run: python -m pytest tests/test_prescreen.py -q
